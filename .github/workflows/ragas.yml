# NOTE:
# Ce workflow est conservé pour documenter l'intégration de l'évaluation
# Ragas dans GitHub Actions.
# Il n'est actuellement pas fonctionnel dans l'environnement GitHub Actions
# en raison d'une incompatibilité de Ragas 0.4.3 avec certaines dépendances
# LangChain / VertexAI.
# Cette correction a seulement été réalisé localement et l'évaluation Ragas 
# doit etre exécuté localement avec evaluation/evaluate_rag.py.

name: RAG Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ragas evaluation
        env:
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
        run: python -m evaluation.evaluate_rag

      - name: Upload Ragas results
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: evaluation/results/ragas_results.csv